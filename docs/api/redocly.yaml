# Настройка линтера OpenAPI.
#
# Здесь выключены ровно те правила, которым проект не следует осознанно.
# Всё остальное должно проходить без предупреждений.
extends:
  - recommended

rules:
  # Адрес localhost в списке серверов — не ошибка, а то, что нужно
  # разработчику: спецификация открывается в Swagger UI и бьёт в
  # локальный сервер без правки файла.
  no-server-example.com: off

  # /readyz отвечает либо 200, либо 503: клиентских ошибок у него не
  # бывает — проверке нечего передать неправильно.
  operation-4xx-response: off
