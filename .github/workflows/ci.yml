# CI: проверки → тесты → сборка (§13.3).
#
# Деплой вынесен в отдельный workflow и запускается руками: прод общий
# с другими проектами, автоматический выкат туда по каждому push —
# плохая идея.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"
  GOFLAGS: -buildvcs=false

jobs:
  go-lint:
    name: Go — статический анализ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: gofmt
        # Незаформатированный код не мёржится.
        run: test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 1; }

      - name: go vet
        run: go vet ./cmd/... ./internal/... ./migrations/...

      # Версия прибита и совпадает с той, что стоит в Makefile: конфиг
      # у нас формата 2, а action v6 ставит линтер первой версии и
      # такой конфиг не читает.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout 5m

  go-test:
    name: Go — тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]
    env:
      # Роли и базы тесты заводят сами: в сервисном контейнере
      # нет init-скриптов.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Тесты под детектором гонок
        run: go test ./cmd/... ./internal/... ./migrations/... -race -count=1 -coverprofile=coverage.out

      - name: Покрытие
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  sqlc:
    name: sqlc — сгенерированный код не отстал
    runs-on: ubuntu-latest
    container: sqlc/sqlc:latest
    steps:
      - uses: actions/checkout@v4
      - run: sqlc diff

  secrets:
    name: Секреты в истории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulncheck:
    name: Известные уязвимости
    runs-on: ubuntu-latest
    # Новая запись в базе не должна валить сборку исправного кода.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./internal/...

  web:
    name: Фронтенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web

      # Лендинг собирается здесь, а не впервые при выкате: сломанная
      # сборка должна краснеть в пайплайне, а не на проде.
      - run: npm ci
        working-directory: landing
      - run: npm run build
        working-directory: landing

  api:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npx --yes @redocly/cli@1.34.2 lint --config docs/api/redocly.yaml docs/api/openapi.yaml

  build:
    name: Сборка
    runs-on: ubuntu-latest
    needs: [go-lint, go-test, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Бинарник под прод
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o bin/app-linux ./cmd/app

      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: bin/app-linux
          retention-days: 14
