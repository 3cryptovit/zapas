# Выкат на прод (§13.4).
#
# Только вручную: сервер общий с другими проектами, и решение
# «выкатываем сейчас» принимает человек, а не push в main.
#
# Нужные секреты репозитория:
#   PROD_SSH_KEY  — приватный ключ для входа на сервер
#   PROD_HOST     — адрес сервера
#   PROD_USER     — пользователь (root)
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Напишите «deploy», чтобы подтвердить
        required: true

concurrency:
  # Два одновременных выката переставляли бы один и тот же бинарник.
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкат
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://zapas.85.198.64.102.nip.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка бинарника
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: -buildvcs=false
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o bin/app-linux ./cmd/app

      - name: Сборка кабинета
        run: npm ci && npm run build
        working-directory: web

      - name: Сборка лендинга
        run: npm ci && npm run build
        working-directory: landing

      - name: Ключ доступа
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Загрузка
        env:
          SSH: ssh -i ~/.ssh/deploy -o BatchMode=yes
          TARGET: ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}
        run: |
          scp -i ~/.ssh/deploy bin/app-linux "$TARGET:/srv/zapas/bin/app.new"
          scp -i ~/.ssh/deploy -r web/dist/. "$TARGET:/srv/zapas/web"
          scp -i ~/.ssh/deploy -r landing/dist/. "$TARGET:/srv/zapas/landing"
          scp -i ~/.ssh/deploy deploy/scripts/backup.sh deploy/scripts/watchdog.sh "$TARGET:/srv/zapas/bin/"

      - name: Миграции и перезапуск
        env:
          TARGET: ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$TARGET" 'set -e
            chown zapas:zapas /srv/zapas/bin/app.new && chmod 755 /srv/zapas/bin/app.new
            chmod 755 /srv/zapas/bin/backup.sh /srv/zapas/bin/watchdog.sh
            chown -R zapas:zapas /srv/zapas/web /srv/zapas/landing
            set -a; . /etc/zapas/zapas.env; set +a
            /srv/zapas/bin/app.new migrate up
            # Бинарник подменяется только после успешных миграций:
            # упавшая миграция оставляет работать прежнюю версию.
            # Предыдущая сборка сохраняется — откат не требует пересборки.
            [ -f /srv/zapas/bin/app ] && cp -p /srv/zapas/bin/app /srv/zapas/bin/app.prev
            mv /srv/zapas/bin/app.new /srv/zapas/bin/app
            systemctl restart zapas-api zapas-worker
            sleep 3
            systemctl is-active zapas-api zapas-worker'

      - name: Проверка после выката
        run: |
          BASE=https://zapas.85.198.64.102.nip.io

          for path in /healthz /readyz /app/ /; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$path")
            echo "$path -> $code"
            # Провал здесь означает откат по docs/runbooks/rollback.md.
            [ "$code" = "200" ]
          done

          # Страница, отдающая 200, но не способная загрузить свои же
          # скрипты, — это белый экран, и /healthz о нём не знает.
          assets=$(curl -s --max-time 20 "$BASE/app/" |
            grep -oE '(src|href)="/app/assets/[^"]+"' | cut -d'"' -f2 | sort -u)
          [ -n "$assets" ]

          for a in $assets; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$a")
            echo "$a -> $code"
            [ "$code" = "200" ]
          done
