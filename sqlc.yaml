version: "2"
sql:
  - engine: postgresql
    queries: queries
    schema: migrations
    gen:
      go:
        package: sqlc
        out: internal/platform/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_result_struct_pointers: false
        overrides:
          # Количества и деньги — только decimal, никакого float (CONVENTIONS.md).
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
