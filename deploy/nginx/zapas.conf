# Zapas на общем домене: лендинг на /zapas/, кабинет на /zapas/app/,
# API на /zapas/api/.
#
# Это не server, а набор location: сервер vitalness.ru принадлежит
# репозиторию портфолио и подключает этот файл строкой
#   include /etc/nginx/snippets/zapas.conf;
# Так каждый проект выкатывается сам и не правит чужой конфиг.
#
# Префикс /zapas срезает nginx: приложение по-прежнему видит /api/v1/...

# Без слеша на конце запрос не попадает в location /zapas/.
location = /zapas {
    return 301 /zapas/;
}

# API.
location /zapas/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Приложение верит X-Real-IP только с петли: от него зависят лимит
    # демо с адреса и защита от перебора пароля.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Создание демо и промотка на 7 дней считают прогноз: им нужен запас.
    proxy_read_timeout 120s;
    # CSV до 5 МБ (FR-4), остальное отсекается раньше приложения.
    client_max_body_size 6m;
}

# Живость и готовность — для внешнего мониторинга.
location = /zapas/healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
    access_log off;
}
location = /zapas/readyz {
    proxy_pass http://127.0.0.1:8080/readyz;
    access_log off;
}

# Вебхук Telegram: секрет проверяет приложение по заголовку.
location = /zapas/telegram/webhook {
    proxy_pass http://127.0.0.1:8080/api/v1/telegram/webhook;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Без слеша на конце запрос уходит в лендинг: человек жмёт «Открыть
# демо», снова видит лендинг и решает, что кнопка сломана.
location = /zapas/app {
    return 301 /zapas/app/;
}

# Ассеты кабинета. Имена содержат хеш — кэшируем навсегда.
#
# Локации только префиксные, а не регулярки: в regex-локации alias
# подставляется целиком, без остатка пути. Путь любого файла тогда
# схлопывается в каталог, nginx отвечает 301, следом 403 — и кабинет
# превращается в белый экран.
location /zapas/app/assets/ {
    alias /srv/zapas/web/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Кабинет: SPA, все пути отдают index.html.
location /zapas/app/ {
    alias /srv/zapas/web/;
    try_files $uri $uri/ /zapas/app/index.html;
}

# Ассеты лендинга.
location /zapas/assets/ {
    alias /srv/zapas/landing/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Лендинг.
location /zapas/ {
    alias /srv/zapas/landing/;
    try_files $uri $uri/ /zapas/index.html;
}
