# Zapas: лендинг на /, кабинет на /app, API на /api.
#
# Сервер общий с другими проектами, поэтому это отдельный site,
# а не замена nginx.conf.

server {
    listen 80;
    listen [::]:80;
    server_name zapas.85.198.64.102.nip.io;

    # Certbot обновляет сертификат по этому пути.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Форма с http2 в listen: директива "http2 on" появилась только
    # в nginx 1.25, а на сервере версия старше.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zapas.85.198.64.102.nip.io;

    ssl_certificate     /etc/letsencrypt/live/zapas.85.198.64.102.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zapas.85.198.64.102.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Заголовки безопасности (§12.2). CSP без inline-скриптов:
    # и лендинг, и кабинет собираются Vite во внешние файлы.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # CSV до 5 МБ (FR-4), остальное отсекается раньше приложения.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Создание демо и промотка на 7 дней считают прогноз: им нужен запас.
        proxy_read_timeout 120s;
    }

    # Живость и готовность — для внешнего мониторинга.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:8080/readyz;
        access_log off;
    }

    # Вебхук Telegram: секрет проверяет приложение по заголовку.
    location = /telegram/webhook {
        proxy_pass http://127.0.0.1:8080/api/v1/telegram/webhook;
        proxy_set_header Host $host;
    }

    # Без слеша на конце запрос не попадает в location /app/ и уходит
    # в лендинг: человек жмёт «Открыть демо», его ведёт на /app, он
    # снова видит лендинг и решает, что кнопка сломана.
    location = /app {
        return 301 /app/;
    }

    # Ассеты кабинета. Имена содержат хеш — кэшируем навсегда.
    #
    # Локация именно префиксная, а не регулярка: в regex-локации alias
    # подставляется целиком, без остатка пути. Путь любого файла тогда
    # схлопывается в каталог /srv/zapas/web/assets/, nginx видит каталог,
    # отвечает 301 со слешем на конце, а следом 403 — и кабинет
    # превращается в белый экран.
    location /app/assets/ {
        alias /srv/zapas/web/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Кабинет: SPA, все пути отдают index.html.
    location /app/ {
        alias /srv/zapas/web/;
        try_files $uri $uri/ /app/index.html;
    }

    # Лендинг.
    location / {
        root /srv/zapas/landing;
        try_files $uri $uri/ /index.html;

        location ~* \.(css|js|svg|woff2)$ {
            root /srv/zapas/landing;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
