name: zapas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: zapas
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-zapas_app}
      MAINT_DB_PASSWORD: ${MAINT_DB_PASSWORD:-zapas_maint}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:-zapas_owner}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zapas"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m

  # Локальный почтовый ящик: письма не уходят наружу, читаются на :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: ["dev"]

volumes:
  pgdata:
